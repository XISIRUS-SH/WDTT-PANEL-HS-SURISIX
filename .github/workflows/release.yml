name: Release
on:
  push:
    tags: ['v*']
jobs:
  release:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: gofmt -w *.go
      - run: git diff --exit-code
      - run: go test ./...
      - run: go vet ./...
      - run: mkdir -p dist
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o dist/wdtt-server-linux-amd64 .
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o dist/wdtt-server-linux-arm64 .
      - run: CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o dist/wdtt-server-windows-amd64.exe .
      - run: cd dist && sha256sum * > SHA256SUMS
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/wdtt-server-linux-amd64
            dist/wdtt-server-linux-arm64
            dist/wdtt-server-windows-amd64.exe
            dist/SHA256SUMS
