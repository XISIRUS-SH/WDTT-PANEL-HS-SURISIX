<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000"><title>{{.Title}}</title>
<style>
:root{--bg:#000;--surface:#0b0b0b;--surface2:#121212;--border:rgba(255,255,255,.08);--text:#f5f5f5;--muted:#9a9a9a;--red:#7A1220;--orange:#C2410C;--amber:#E8792C;--ok:#22C55E;--warn:#F59E0B;--bad:#EF4444}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px Inter,system-ui,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;color:var(--text)}.hidden{display:none!important}.app{min-height:100vh;display:flex}.side{width:250px;padding:22px 15px;border-right:1px solid var(--border);background:#050505;display:flex;flex-direction:column}.brand{font-size:23px;font-weight:850;margin:2px 9px 25px}.brand b{color:var(--amber)}.nav{display:grid;gap:7px}.nav button{border:1px solid transparent;background:transparent;border-radius:10px;text-align:left;padding:13px 14px;min-height:46px;color:var(--muted)}.nav button.active,.nav button:hover{background:var(--surface2);color:var(--text);border-color:var(--border)}.nav button.active{box-shadow:inset 3px 0 0 var(--orange)}.sidefoot{margin-top:auto;color:var(--muted);font-size:12px;padding:10px}.main{flex:1;min-width:0;padding:26px 30px}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:26px}.eyebrow{font-size:11px;letter-spacing:.18em;color:var(--muted)}h1{margin:4px 0;font-size:30px}h2{margin:0 0 6px;font-size:24px}h3{margin:0 0 14px}.muted{color:var(--muted)}.grid{display:grid;gap:14px}.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(3,minmax(0,1fr))}.g4{grid-template-columns:repeat(4,minmax(0,1fr))}.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:19px}.stat strong{font-size:25px;display:block}.stat span{color:var(--muted);font-size:12px}.toolbar{display:flex;gap:9px;flex-wrap:wrap;align-items:center}.btn{min-height:44px;padding:0 15px;border-radius:9px;border:1px solid var(--border);background:transparent}.btn:hover{background:var(--surface2)}.primary{border:0;background:linear-gradient(100deg,var(--red),var(--orange),var(--amber));font-weight:750}.danger{border-color:rgba(239,68,68,.45);color:#ffb4b4}.field{display:grid;gap:7px;margin:0 0 14px}.field label{font-size:12px;color:var(--muted)}input,select,textarea{width:100%;min-height:44px;border-radius:8px;border:1px solid var(--border);background:#050505;color:var(--text);padding:9px 11px;outline:none}textarea{min-height:100px;resize:vertical}input:focus,select:focus,textarea:focus{border-color:var(--orange);box-shadow:0 0 0 2px rgba(194,65,12,.15)}.client{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:15px;padding:15px 0;border-bottom:1px solid var(--border)}.client:last-child{border-bottom:0}.client h3{margin:0 0 5px;font-size:15px}.chips{display:flex;gap:6px;flex-wrap:wrap}.chip{font-size:11px;padding:5px 8px;border-radius:999px;border:1px solid var(--border);color:var(--muted)}.status{font-size:12px}.ok{color:var(--ok)}.warn{color:var(--warn)}.bad{color:var(--bad)}pre{white-space:pre-wrap;word-break:break-word;background:#000;border:1px solid var(--border);border-radius:9px;padding:14px;font:12px/1.5 "JetBrains Mono","Fira Code",monospace;max-height:520px;overflow:auto}.login{min-height:100vh;display:grid;place-items:center;padding:20px}.login .card{width:min(430px,100%);padding:30px}.toast{position:fixed;right:18px;bottom:18px;max-width:420px;background:#161616;border:1px solid var(--border);border-radius:10px;padding:13px 15px;box-shadow:0 12px 40px #000}.modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:grid;place-items:center;padding:20px}.modal .card{width:min(850px,100%);max-height:90vh;overflow:auto}.close{float:right}.tabs{display:flex;gap:6px;overflow:auto;margin-bottom:15px}.tabs button{white-space:nowrap}.metricbar{height:8px;background:#090909;border:1px solid var(--border);border-radius:99px;overflow:hidden}.metricbar i{display:block;height:100%;background:linear-gradient(90deg,var(--red),var(--orange),var(--amber));width:0}.dangerbox{background:#2B0A10;border:1px solid rgba(239,68,68,.25);border-radius:10px;padding:12px}.small{font-size:12px}.actions{display:flex;gap:7px;flex-wrap:wrap}@media(max-width:980px){.side{width:205px}.g4{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:680px){.app{display:block}.side{width:100%;padding:14px;border-right:0;border-bottom:1px solid var(--border)}.nav{display:flex;overflow:auto}.nav button{white-space:nowrap}.sidefoot{display:none}.main{padding:18px 14px}.top{align-items:flex-start;flex-direction:column}.g2,.g3,.g4{grid-template-columns:1fr}.toolbar .btn{width:100%}.client{grid-template-columns:1fr}.actions .btn{flex:1;min-width:120px}}
</style></head><body>
<div id="login" class="login"><div class="card"><div class="brand">WDTT <b>Panel</b></div><h2>Вход администратора</h2><p class="muted">Используется главный пароль существующего WDTT-сервера.</p><form id="loginForm"><div class="field"><label>Главный пароль</label><input id="loginPassword" type="password" autocomplete="current-password" required></div><button class="btn primary" style="width:100%">Войти</button></form><p id="loginError" class="bad"></p></div></div>
<div id="app" class="app hidden"><aside class="side"><div class="brand">WDTT <b>Panel</b></div><div class="nav"><button data-tab="overview">Обзор</button><button data-tab="clients">Клиенты</button><button data-tab="routing">Маршрутизация</button><button data-tab="diagnostics">Диагностика</button><button data-tab="settings">Настройки</button></div><div class="sidefoot">v{{.Version}}<br><button id="logout" class="btn" style="margin-top:10px;width:100%">Выйти</button></div></aside><main class="main"><div class="top"><div><div class="eyebrow">WDTT PLUS · ADMIN</div><h1 id="title">Обзор</h1></div><div><div id="topStatus" class="status ok">● Сервер подключён</div><div id="sessionStatus" class="muted small"></div></div></div><div id="view"></div></main></div><div id="modal" class="modal hidden"></div><div id="toast" class="toast hidden"></div>
<script>
const $=s=>document.querySelector(s), $$=s=>[...document.querySelectorAll(s)]; let tab='overview',state=null,selected=null;
function csrf(){return document.cookie.split('; ').find(x=>x.startsWith('wdtt_panel_csrf='))?.split('=')[1]||''}
async function api(path,opt={}){let o={credentials:'include',headers:{'Content-Type':'application/json',...(opt.headers||{})},...opt};if(o.body)o.headers['X-WDTT-CSRF']=csrf();let r=await fetch('/panel/api'+path,o);let d=await r.json().catch(()=>({ok:false,message:'Ошибка ответа'}));if(r.status===401){showLogin();throw Error(d.message||'Сессия истекла')}if(!r.ok||d.ok===false)throw Error(d.message||'Ошибка');return d}
function toast(x,bad=false){let e=$('#toast');e.textContent=x;e.className='toast';if(bad)e.style.borderColor='rgba(239,68,68,.5)';setTimeout(()=>e.className='toast hidden',4000)}
function showLogin(){state=null;$('#app').className='app hidden';$('#login').className='login'}
async function login(e){e.preventDefault();$('#loginError').textContent='';try{await api('/login',{method:'POST',body:JSON.stringify({password:$('#loginPassword').value})});$('#loginPassword').value='';$('#login').className='login hidden';$('#app').className='app';await refresh();render()}catch(x){$('#loginError').textContent=x.message}}
async function refresh(){let d=await api('/list');state=d;return d}
function fmt(n){return Number(n||0).toLocaleString('ru-RU')};function mb(n){return `${Number(n||0).toFixed(1)} Mbps`};function date(ts){return ts?new Date(ts*1000).toLocaleString('ru-RU'): '—'}
function dot(status){let c=status==='active'?'ok':(status==='deactivated'?'warn':status.startsWith('expired')?'bad':'bad');let t={active:'Работает',deactivated:'Отключён',expired:'Истёк',expired_retained:'Истёк · хранится',broken:'Повреждён'}[status]||status;return `<span class="${c}">● ${t}</span>`}
function render(){let titles={overview:'Обзор',clients:'Клиенты',routing:'Маршрутизация',diagnostics:'Диагностика',settings:'Настройки'};$('#title').textContent=titles[tab];$$('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab===tab));({overview:renderOverview,clients:renderClients,routing:renderRouting,diagnostics:renderDiagnostics,settings:renderSettings}[tab])()}
function renderOverview(){let s=state?.server||{};let cap=s.max_passwords?Math.round((s.password_count/s.max_passwords)*100):0;$('#view').innerHTML=`<div class="grid g4"><div class="card stat"><strong>${fmt(s.active_connections)}</strong><span>Активные подключения</span></div><div class="card stat"><strong>${mb(s.network_rx_mbps)}</strong><span>Трафик ↓</span></div><div class="card stat"><strong>${mb(s.network_tx_mbps)}</strong><span>Трафик ↑</span></div><div class="card stat"><strong>${fmt(s.password_count)} / ${fmt(s.max_passwords)}</strong><span>Клиенты</span></div></div><div class="grid g2" style="margin-top:14px"><div class="card"><h3>Состояние сервера</h3><div class="chips"><span class="chip">WDTT ${s.wdtt_plus_version||'—'}</span><span class="chip">WG: ${s.wg_backend||'—'}</span><span class="chip">IP: ${s.effective_public_ip||s.public_ip||'auto'}</span></div><p class="muted small">DNS: ${s.dns||'—'} · Порты: ${s.default_ports||'—'}</p><div class="metricbar"><i style="width:${Math.min(cap,100)}%"></i></div><p class="muted small">Заполненность лимита: ${cap}%</p></div><div class="card"><h3>Ошибки транспорта</h3><div class="grid g2"><div>Handshake <b>${fmt(s.handshake_failures)}</b></div><div>Throttles <b>${fmt(s.handshake_throttles)}</b></div><div>Packet drops <b>${fmt(s.packet_drops)}</b></div><div>UDP errors <b>${fmt(s.udp_write_errors)}</b></div><div>Reconnects <b>${fmt(s.reconnects)}</b></div><div>Worker rejects <b>${fmt(s.worker_limit_rejections)}</b></div></div></div></div><div class="card" style="margin-top:14px"><div class="toolbar"><button class="btn primary" onclick="tab='clients';render()">Управление клиентами</button><button class="btn" onclick="tab='diagnostics';render()">Открыть диагностику</button><button class="btn" onclick="tab='routing';render()">Маршрутизация</button></div></div>`}
function renderClients(){let a=state?.passwords||[];$('#view').innerHTML=`<div class="toolbar" style="margin-bottom:14px"><button class="btn primary" onclick="createClient()">＋ Создать клиента</button><button class="btn" onclick="importClient()">Импорт состояния</button><button class="btn" onclick="refresh().then(render)">Обновить</button><span class="muted small">Данные перечитываются из общей admin-БД.</span></div><div class="card">${a.length?a.map(c=>`<div class="client"><div><h3>${esc(c.label||'Без названия')}</h3><div class="chips"><span class="chip">${esc(c.password)}</span><span class="chip">${esc(c.vk_hash||'VK hash не задан')}</span><span class="chip">${esc(c.ports||'—')}</span>${c.device_id?`<span class="chip">${esc(c.device_id)}</span>`:''}</div><p class="muted small">${dot(c.status)} · срок: ${date(c.expires_at)} · ↓ ${fmt(c.down_bytes)} B · ↑ ${fmt(c.up_bytes)} B</p></div><div class="actions"><button class="btn" onclick="openClient('${encodeURIComponent(c.password)}')">Открыть</button><button class="btn danger" onclick="confirmDelete('${encodeURIComponent(c.password)}')">Удалить</button></div></div>`).join(''):`<p class="muted">Клиентов пока нет.</p>`}</div>`}
function esc(x){return String(x??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function cmd(args){let d=await api('/command',{method:'POST',body:JSON.stringify({args})});if(!d.ok)throw Error(d.message||'Команда не выполнена');await refresh();return d}
function openCaptcha(){let url=($('#createHash')?.value||'').trim();if(!/^https?:\/\//i.test(url)){toast('Сначала вставь полную VK-ссылку для ручной проверки',true);return}openModal(`<button class="btn close" onclick="closeModal()">Закрыть</button><h2>VK · ручная проверка</h2><p class="muted small">Никакого автоматического решения CAPTCHA. Пройди проверку сам, затем вернись к форме.</p><iframe src="${esc(url)}" style="width:100%;height:60vh;border:1px solid var(--border);border-radius:10px;background:#fff"></iframe>`)}
function createClient(){openModal(`<button class="btn close" onclick="closeModal()">Закрыть</button><h2>Создать клиента</h2><form id="createForm"><div class="field"><label>Название</label><input name="label" maxlength="40"></div><div class="field"><label>VK-ссылки / хеши</label><textarea id="createHash" name="hash" placeholder="Можно вставить несколько ссылок или хешей"></textarea></div><button type="button" class="btn" onclick="openCaptcha()">Открыть VK вручную</button><div class="grid g2"><div class="field"><label>Срок, дней (0 = бессрочно)</label><input name="days" type="number" min="0" max="365" value="30"></div><div class="field"><label>Порты DTLS,WG,TUN</label><input name="ports" placeholder="56000,56001,9000"></div></div><div class="field"><label>Свой пароль клиента (необязательно)</label><input name="password" autocomplete="off"></div><button class="btn primary">Создать</button></form>`);$('#createForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),a=['create','--days',f.get('days'),'--label',f.get('label'),'--vk-hash',f.get('hash'),'--ports',f.get('ports')];if(f.get('password'))a.push('--client-password',f.get('password'));try{let d=await cmd(a);closeModal();toast(d.message||'Клиент создан');render()}catch(x){toast(x.message,true)}}}
async function importClient(){openModal(`<button class="btn close" onclick="closeModal()">Закрыть</button><h2>Импорт состояния клиента</h2><p class="muted">Выбери JSON, ранее экспортированный из этой панели. Целевой клиент должен быть пустым.</p><form id="impForm"><div class="field"><label>Пароль существующего клиента</label><input name="password" required></div><div class="field"><label>Operation ID</label><input name="operation" required placeholder="migration-2026-..."></div><div class="field"><label>Файл состояния</label><input name="file" type="file" accept="application/json,.json" required></div><button class="btn primary">Импортировать</button></form>`);$('#impForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),file=f.get('file');try{let text=await file.text();let bytes=new TextEncoder().encode(text),bin='';bytes.forEach(b=>bin+=String.fromCharCode(b));let encoded=btoa(bin).replaceAll('+','-').replaceAll('/','_').replaceAll('=','');let d=await cmd(['import-client-state','--password',f.get('password'),'--operation-id',f.get('operation'),'--state',encoded]);closeModal();toast(d.message||'Импорт завершён');render()}catch(x){toast(x.message,true)}}}
async function openClient(p){let password=decodeURIComponent(p);try{let d=await api('/command',{method:'POST',body:JSON.stringify({args:['details','--password',password]})});selected=d.password;openClientModal(d.password)}catch(x){toast(x.message,true)}}
function openClientModal(c){openModal(`<button class="btn close" onclick="closeModal()">Закрыть</button><h2>${esc(c.label||'Клиент')}</h2><div class="chips"><span class="chip">Пароль: ${esc(c.password)}</span>${dot(c.status)}</div><div class="grid g2" style="margin-top:16px"><div><div class="field"><label>Название</label><input id="eLabel" value="${esc(c.label)}"></div><div class="field"><label>VK hash</label><textarea id="eHash">${esc(c.vk_hash)}</textarea></div><div class="field"><label>Порты</label><input id="ePorts" value="${esc(c.ports)}"></div></div><div><div class="card"><h3>Устройство</h3><pre>${esc(JSON.stringify(c.device||{},null,2))}</pre></div><div class="card"><h3>История привязки</h3><pre>${esc(JSON.stringify(c.bind_history||[],null,2))}</pre></div></div></div><div class="actions"><button class="btn primary" onclick="saveClient('${encodeURIComponent(c.password)}')">Сохранить</button><button class="btn" onclick="clientAction('activate','${encodeURIComponent(c.password)}')">Активировать</button><button class="btn" onclick="clientAction('deactivate','${encodeURIComponent(c.password)}')">Отключить</button><button class="btn" onclick="clientAction('unbind','${encodeURIComponent(c.password)}')">Отвязать устройство</button><button class="btn" onclick="exportClient('${encodeURIComponent(c.password)}')">Экспорт состояния</button><button class="btn danger" onclick="confirmDelete('${encodeURIComponent(c.password)}')">Удалить</button></div>`)}
async function saveClient(p){let pass=decodeURIComponent(p);try{await cmd(['update-client','--password',pass,'--label',$('#eLabel').value,'--vk-hash',$('#eHash').value,'--ports',$('#ePorts').value]);toast('Клиент обновлён');await refresh();render();closeModal()}catch(x){toast(x.message,true)}}
async function clientAction(a,p){let labels={deactivate:'Отключить клиента?',unbind:'Отвязать устройство?',activate:'Активировать клиента?'};if(labels[a]&&!confirm(labels[a]))return;try{let d=await cmd([a,'--password',decodeURIComponent(p)]);toast(d.message||'Готово');await refresh();render();if(selected)openClient(p)}catch(x){toast(x.message,true)}}
function confirmDelete(p){let pass=decodeURIComponent(p);openModal(`<h2>Удалить клиента?</h2><p class="muted">Будет удалена запись и отвязано устройство. Действие необратимо.</p><div class="actions"><button class="btn danger" onclick="doDelete('${encodeURIComponent(pass)}')">Да, удалить</button><button class="btn" onclick="closeModal()">Отмена</button></div>`)}
async function doDelete(p){try{let d=await cmd(['delete','--password',decodeURIComponent(p)]);closeModal();selected=null;toast(d.message||'Удалено');await refresh();render()}catch(x){toast(x.message,true)}}
async function exportClient(p){try{let d=await cmd(['export-client-state','--password',decodeURIComponent(p)]);let raw=btoa(unescape(encodeURIComponent(JSON.stringify(d.client_state||{})))).replaceAll('+','-').replaceAll('/','_').replaceAll('=','');let blob=new Blob([JSON.stringify(d.client_state||{},null,2)],{type:'application/json'});let a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`wdtt-client-${decodeURIComponent(p)}.json`;a.click();URL.revokeObjectURL(a.href);toast('Состояние экспортировано')}catch(x){toast(x.message,true)}}
function renderRouting(){ $('#view').innerHTML=`<div class="grid g2"><div class="card"><h3>Текущий выход</h3><pre id="outStatus">Загрузка…</pre><div class="actions"><button class="btn" onclick="loadOutbound()">Обновить</button><button class="btn" onclick="outbound('/outbound/diagnostics')">Диагностика</button><button class="btn primary" onclick="if(confirm('Вернуть прямой выход?'))outbound('/outbound/direct')">Вернуть прямой выход</button></div></div><div class="card"><h3>Режимы выхода</h3><div class="actions"><button class="btn" onclick="openLocalProxy()">Прокси VPS</button><button class="btn" onclick="openExternalProxy()">Внешний TCP-прокси</button><button class="btn" onclick="outbound('/outbound/warp/check')">WARP: проверить</button><button class="btn danger" onclick="if(confirm('Удалить текущий WARP-выход?'))outbound('/outbound/warp/delete')">WARP: удалить</button><button class="btn danger" onclick="if(confirm('Удалить импортированный WireGuard exit?'))outbound('/outbound/wg/delete')">WG-файл: удалить</button></div><p class="muted small" style="margin-top:12px">Первичная настройка другого VPS/WireGuard-профиля остаётся существующей логикой WDTT; панель не создаёт второй transport layer.</p></div></div><div class="card" style="margin-top:14px"><h3>Операционный принцип</h3><div class="dangerbox small">Перед включением несовместимого режима выполняйте диагностику. При ошибке существующие скрипты WDTT должны откатить маршрут и оставить прямой выход.</div></div>`;loadOutbound()}
function openLocalProxy(){openModal(`<button class="btn close" onclick="closeModal()">Закрыть</button><h2>Прокси VPS</h2><p class="muted">Создаёт прокси на этом же VPS. Выходной IP остаётся IP VPS.</p><form id="lpForm"><div class="field"><label>Логин</label><input name="login" required></div><div class="field"><label>Пароль</label><input name="password" type="password" required></div><div class="field"><label>Порт</label><input name="port" type="number" min="1" max="65535" value="3128" required></div><button class="btn primary">Установить</button></form><div class="actions" style="margin-top:10px"><button class="btn" onclick="outbound('/outbound/local-proxy/check')">Проверить</button><button class="btn danger" onclick="if(confirm('Удалить локальный прокси?'))outbound('/outbound/local-proxy/remove')">Удалить</button></div>`);$('#lpForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{let d=await api('/outbound/local-proxy',{method:'POST',body:JSON.stringify({login:f.get('login'),password:f.get('password'),port:Number(f.get('port'))})});openModal(`<button class="btn close" onclick="closeModal()">Закрыть</button><h2>${d.ok?'Готово':'Ошибка'}</h2><pre>${esc(d.output||d.message||'')}</pre>`)}catch(x){toast(x.message,true)}}}
function openExternalProxy(){openModal(`<button class="btn close" onclick="closeModal()">Закрыть</button><h2>Внешний TCP-прокси</h2><form id="epForm"><div class="field"><label>Тип</label><select name="kind"><option>socks5</option><option>http</option><option>https</option></select></div><div class="field"><label>Host</label><input name="host" required></div><div class="field"><label>Port</label><input name="port" type="number" min="1" max="65535" required></div><div class="field"><label>Логин (если нужен)</label><input name="login"></div><div class="field"><label>Пароль (если нужен)</label><input name="password" type="password"></div><button class="btn primary">Включить и проверить</button></form>`);$('#epForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);try{let d=await api('/outbound/external-proxy',{method:'POST',body:JSON.stringify({kind:f.get('kind'),host:f.get('host'),port:Number(f.get('port')),login:f.get('login'),password:f.get('password')})});openModal(`<button class="btn close" onclick="closeModal()">Закрыть</button><h2>${d.ok?'Готово':'Ошибка'}</h2><pre>${esc(d.output||d.message||'')}</pre>`);loadOutbound()}catch(x){toast(x.message,true)}}}
function renderDiagnostics(){let s=state?.server||{};$('#view').innerHTML=`<div class="grid g4"><div class="card stat"><strong>${fmt(s.packet_drops)}</strong><span>Packet drops</span></div><div class="card stat"><strong>${fmt(s.handshake_failures)}</strong><span>Handshake failures</span></div><div class="card stat"><strong>${fmt(s.udp_write_errors)}</strong><span>UDP write errors</span></div><div class="card stat"><strong>${fmt(s.reconnects)}</strong><span>Reconnects</span></div></div><div class="grid g2" style="margin-top:14px"><div class="card"><h3>Компоненты</h3>${[['Системный DNS','DNS'],['DNS-путь клиента','Client DNS'],['VKCalls / резервные узлы','VKCalls'],['DTLS','DTLS'],['WireGuard handshake','WireGuard'],['WRAP','WRAP'],['UDP-порты','UDP'],['Исходящий интернет','Internet']].map(x=>`<p><span class="ok">●</span> ${x[0]} <span class="muted">— данные runtime/logs</span></p>`).join('')}</div><div class="card"><h3>Полные серверные метрики</h3><pre>${esc(JSON.stringify(s,null,2))}</pre></div></div>`}
function renderSettings(){let s=state?.server||{},p=s.admin_profile||{};$('#view').innerHTML=`<div class="grid g2"><div class="card"><h3>Сервер</h3><form id="settingsForm"><div class="field"><label>DNS</label><input name="dns" value="${esc(s.dns||'')}"></div><div class="field"><label>Лимит клиентов (1..500)</label><input name="limit" type="number" min="1" max="500" value="${s.max_passwords||50}"></div><div class="field"><label>Стандартные порты DTLS,WG,TUN</label><input name="ports" value="${esc(s.default_ports||'')}"></div><div class="field"><label>Публичный IP / домен / auto</label><input name="public" value="${esc(s.public_ip||'auto')}"></div><button class="btn primary">Сохранить настройки</button></form></div><div class="card"><h3>Профиль владельца</h3><form id="profileForm"><div class="field"><label>VK hashes</label><textarea name="vk">${esc(p.vk_hashes||'')}</textarea></div><div class="field"><label>Резервный VK hash</label><input name="secondary" value="${esc(p.secondary_vk_hash||'')}"></div><div class="field"><label>Название профиля</label><input name="name" value="${esc(p.profile_name||'')}"></div><div class="grid g2"><div class="field"><label>Workers / hash</label><input name="workers" type="number" min="1" max="128" value="${p.workers_per_hash||16}"></div><div class="field"><label>Protocol</label><select name="protocol"><option ${p.protocol==='udp'?'selected':''}>udp</option><option ${p.protocol==='tcp'?'selected':''}>tcp</option></select></div></div><div class="field"><label>SNI</label><input name="sni" value="${esc(p.sni||'')}"></div><div class="field"><label>Порты профиля</label><input name="ports" value="${esc(p.ports||s.default_ports||'')}"></div><button class="btn primary">Сохранить профиль</button></form></div></div><div class="card" style="margin-top:14px"><h3>Публичный IP</h3><button class="btn" onclick="refreshIP()">Определить заново</button></div>`;$('#settingsForm').onsubmit=saveSettings;$('#profileForm').onsubmit=saveProfile}
async function saveSettings(e){e.preventDefault();let f=new FormData(e.target);try{let d=await cmd(['update-settings','--dns',f.get('dns'),'--limit',f.get('limit'),'--ports',f.get('ports'),'--public-ip',f.get('public')]);toast(d.message||'Настройки сохранены');render()}catch(x){toast(x.message,true)}}
async function saveProfile(e){e.preventDefault();let f=new FormData(e.target);try{let a=['update-admin-profile','--vk-hashes',f.get('vk'),'--secondary-vk-hash',f.get('secondary'),'--profile-name',f.get('name'),'--workers',f.get('workers'),'--protocol',f.get('protocol'),'--sni',f.get('sni'),'--ports',f.get('ports')];let d=await cmd(a);toast(d.message||'Профиль сохранён');render()}catch(x){toast(x.message,true)}}
async function refreshIP(){try{let d=await cmd(['refresh-public-ip']);toast(d.message||'IP обновлён');render()}catch(x){toast(x.message,true)}}
function openModal(html){$('#modal').innerHTML='<div class="card">'+html+'</div>';$('#modal').className='modal'}function closeModal(){$('#modal').className='modal hidden'}
$$('[data-tab]').forEach(b=>b.onclick=()=>{tab=b.dataset.tab;render()});$('#loginForm').onsubmit=login;$('#logout').onclick=async()=>{await api('/logout',{method:'POST'});showLogin()};
let sessionExpires=0;
async function refreshSession(){try{let d=await api('/session');sessionExpires=d.session_expires_at||0;$('#sessionStatus').textContent=sessionExpires?'Сессия до '+date(sessionExpires):'';return true}catch(e){return false}}
(async()=>{try{await refreshSession();$('#login').className='login hidden';$('#app').className='app';await refresh();render()}catch(e){}})();setInterval(async()=>{if(!$('#app').classList.contains('hidden')){try{if(sessionExpires&&Date.now()/1000>=sessionExpires){showLogin();return}await refresh();if(tab==='overview'||tab==='clients'||tab==='diagnostics')render()}catch(e){}}},5000);setInterval(()=>{if(sessionExpires){$('#sessionStatus').textContent='Сессия до '+date(sessionExpires)}},30000);
</script></body></html>
